name: Podbij wersję pluginu

on:
  push:
    branches: [main]
    paths:
      - 'studio/**'
      - '.claude-plugin/**'

jobs:
  bump:
    runs-on: ubuntu-latest
    # Nie uruchamiaj jeśli commit pochodzi od tego samego workflow (pętla)
    if: "!startsWith(github.event.head_commit.message, 'wersja ')"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Podbij patch wersji
        run: |
          PLIK="studio/.claude-plugin/plugin.json"
          STARA=$(node -p "require('./$PLIK').version")
          NOWA=$(node -p "
            const [x,y,z] = '$STARA'.split('.').map(Number);
            \`\${x}.\${y}.\${z+1}\`
          ")
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('$PLIK', 'utf8'));
            d.version = '$NOWA';
            fs.writeFileSync('$PLIK', JSON.stringify(d, null, 2) + '\n');
          "
          echo "STARA=$STARA" >> $GITHUB_ENV
          echo "NOWA=$NOWA" >> $GITHUB_ENV

      - name: Commit nowej wersji
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add studio/.claude-plugin/plugin.json
          git commit -m "wersja ${{ env.NOWA }} (było ${{ env.STARA }})"
          git push
