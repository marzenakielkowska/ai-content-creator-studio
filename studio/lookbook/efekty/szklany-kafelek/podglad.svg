  <rect x="40" y="130" width="280" height="20" fill="rgba(255,255,255,.08)"/>
  <!-- odbicie / highlight na górze -->
  <path d="M60 78 Q180 68 320 78" stroke="rgba(255,255,255,.4)" stroke-width="1.2" fill="none"/>
  <!-- treść kafelka -->
  <rect x="62" y="112" width="60" height="60" rx="12" fill="rgba(255,255,255,.15)" stroke="rgba(255,255,255,.25)" stroke-width="1"/>
  <text x="92" y="153" text-anchor="middle" font-size="32" fill="white" opacity=".7">◈</text>
  <rect x="138" y="118" width="156" height="12" rx="6" fill="rgba(255,255,255,.45)"/>
  <rect x="138" y="138" width="110" height="10" rx="5" fill="rgba(255,255,255,.3)"/>
  <rect x="138" y="156" width="130" height="10" rx="5" fill="rgba(255,255,255,.25)"/>
  <line x1="62" y1="195" x2="298" y2="195" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <rect x="62" y="210" width="220" height="10" rx="5" fill="rgba(255,255,255,.2)"/>
  <rect x="62" y="228" width="180" height="10" rx="5" fill="rgba(255,255,255,.15)"/>
  <rect x="62" y="246" width="200" height="10" rx="5" fill="rgba(255,255,255,.15)"/>
  <rect x="62" y="264" width="130" height="10" rx="5" fill="rgba(255,255,255,.1)"/>
  <!-- zaokrąglony dolny brzeg -->
  <rect x="40" y="330" width="280" height="30" rx="24" fill="rgba(255,255,255,.08)"/>

<path d="M0 640 Q0 500 180 500 Q360 500 360 640 Z" fill="#c9a4ae" stroke="white" stroke-width="2.2"/><circle cx="180" cy="430" r="64" fill="#c9a4ae" stroke="white" stroke-width="2.2"/>
