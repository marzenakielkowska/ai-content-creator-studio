  <path d="M164 260 L156 260 M170 252 L156 260 L170 268" stroke="#c9a4ae" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 260 L204 260 M190 252 L204 260 L190 268" stroke="#c9a4ae" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- etykiety -->
  <rect x="20" y="85" width="120" height="22" rx="11" fill="rgba(255,255,255,.2)" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
  <rect x="34" y="92" width="80" height="10" rx="5" fill="rgba(255,255,255,.4)"/>
  <rect x="200" y="85" width="130" height="22" rx="11" fill="rgba(255,255,255,.25)" stroke="rgba(255,255,255,.35)" stroke-width="1"/>
  <rect x="214" y="92" width="90" height="10" rx="5" fill="rgba(255,255,255,.5)"/>

<path d="M0 640 Q0 500 180 500 Q360 500 360 640 Z" fill="#c9a4ae" stroke="white" stroke-width="2.2"/><circle cx="180" cy="430" r="64" fill="#c9a4ae" stroke="white" stroke-width="2.2"/>
