<svg viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" width="360" height="640">
  <defs>
    <linearGradient id="bgv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede8f7"/>
      <stop offset="58%" stop-color="#c5afd6"/>
      <stop offset="100%" stop-color="#9068b0"/>
    </linearGradient>
  </defs>

  <rect width="360" height="640" fill="url(#bgv)"/>

  <!-- karta tylna lewa -->
  <rect x="14" y="256" width="60" height="107" rx="10" fill="rgba(201,164,174,0.30)" stroke="white" stroke-width="1.5"/>
  <!-- karta tylna góra -->
  <rect x="148" y="118" width="64" height="114" rx="10" fill="rgba(201,164,174,0.30)" stroke="white" stroke-width="1.5"/>

  <!-- orbita pozioma (jedyna) -->
  <ellipse cx="180" cy="310" rx="155" ry="60" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="12 7" opacity="0.7"/>

  <!-- karta tylna prawa -->
  <rect x="286" y="278" width="58" height="103" rx="10" fill="rgba(201,164,174,0.30)" stroke="white" stroke-width="1.5"/>

  <!-- czarne strzałki kierunku: od lewej do prawej (górny łuk → w prawo, dolny łuk → w lewo) -->
  <g transform="translate(180,250)">
    <polyline points="-11,-9 11,0 -11,9" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>
  <g transform="translate(180,371) rotate(180,0,0)">
    <polyline points="-11,-9 11,0 -11,9" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>

  <!-- postać — tułów (kopuła) -->
  <path d="M20 640 Q20 498 180 498 Q340 498 340 640 Z" fill="#c9a4ae" stroke="white" stroke-width="2.2"/>
  <!-- postać — głowa -->
  <circle cx="180" cy="434" r="66" fill="#c9a4ae" stroke="white" stroke-width="2.2"/>

  <!-- karta przednia (przed postacią) -->
  <rect x="76" y="390" width="68" height="120" rx="12" fill="rgba(201,164,174,0.40)" stroke="white" stroke-width="1.8"/>
</svg>
